<style>
  html, body {
    margin: 0; padding: 0;
    background: #0A0A1A;
    color: #E4E1F0;
    font-family: -apple-system, system-ui, sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .splash {
    text-align: center;
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .splash h1 {
    font-family: 'Cinzel', 'Trajan Pro', serif;
    font-size: 28px;
    letter-spacing: 6px;
    color: #FFD53D;
    margin: 0 0 6px;
    text-shadow: 0 0 20px rgba(255, 213, 61, 0.4);
  }
  .splash p {
    font-size: 11px;
    letter-spacing: 2px;
    color: #8A88A0;
    margin: 0 0 20px;
  }
  .spinner {
    width: 36px; height: 36px;
    margin: 0 auto;
    border: 3px solid rgba(255, 213, 61, 0.20);
    border-top-color: #FFD53D;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<!-- Auto-redirect to the game shell. Falls back to a tap-link if JS disabled. -->
<script>
  // Preserve any query string + hash so deep-links keep working.
  const tail = (location.search || '') + (location.hash || '');
  location.replace('blocksworn_index_fixed.html' + tail);
</script>
</head>
<body>
<div class="splash">
  <h1>BLOCKSWORM</h1>

  <div class="spinner"></div>
